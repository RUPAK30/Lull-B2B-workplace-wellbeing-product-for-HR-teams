<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lull · Desk card</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<style>
  /* Open as card.html?for=Company&team=sales, then print (A5 landscape works well, or A4). */
  @page{size:A5 landscape;margin:0}
  body{background:#fff}
  .card{width:210mm;height:148mm;margin:0 auto;padding:12mm 14mm;display:grid;grid-template-columns:1fr 52mm;gap:10mm;align-items:center;background:var(--bg)}
  .card-brand{display:flex;align-items:center;gap:8px;font:500 1.3rem/1 var(--serif);margin-bottom:8mm}
  .card-brand img{width:26px;height:26px}
  .card h1{font-size:2.2rem;line-height:1.08}
  .card .lede{margin-top:5mm;font-size:1.05rem;color:var(--ink)}
  .card-note{margin-top:7mm;font-size:.85rem;color:var(--ink-2);border-top:1px solid var(--line);padding-top:4mm}
  .qr{background:#fff;border-radius:12px;padding:4mm;box-shadow:0 0 0 1px var(--line)}
  .qr img,.qr canvas{width:100%!important;height:auto!important;display:block}
  .qr-cap{margin-top:3mm;font-size:.72rem;color:var(--ink-3);text-align:center;overflow-wrap:anywhere}
  .tools{max-width:210mm;margin:12px auto;padding:0 14mm;font:400 .85rem var(--sans);color:var(--ink-3)}
  .tools button{margin-left:8px}
  @media print{.tools{display:none}}
</style>
</head>
<body>
<p class="tools">Check the team name, then print. <button type="button" class="btn btn-ghost" onclick="window.print()">Print</button></p>
<article class="card">
  <div>
    <p class="card-brand"><img src="favicon.svg" alt="">lull</p>
    <h1>Three minutes between calls.</h1>
    <p class="lede">Type how you feel, even in Hinglish. Get one short guided movement break.</p>
    <p class="card-note" id="card-note">Private by design: your company sees team totals only. Never who used it, never what you type.</p>
  </div>
  <div>
    <div class="qr" id="qr" role="img" aria-label="QR code that opens Lull"></div>
    <p class="qr-cap" id="qr-cap"></p>
  </div>
</article>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var company = (q.get('for') || '').replace(/[^\p{L}\p{N} &.,'()-]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 40);
  var team = (q.get('team') || '').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 24);
  var link = 'https://lull-hr.vercel.app/app/' + (team ? '?team=' + team : '');
  if (company) document.getElementById('card-note').textContent = 'Private by design: ' + company + ' sees team totals only. Never who used it, never what you type.';
  document.getElementById('qr-cap').textContent = link.replace('https://', '');
  if (window.QRCode) new QRCode(document.getElementById('qr'), { text: link, width: 512, height: 512, colorDark: '#1F2933', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  else document.getElementById('qr').textContent = link;
})();
</script>
</body>
</html>
