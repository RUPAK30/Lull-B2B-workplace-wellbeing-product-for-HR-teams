<style>
:root{--paper:#FAF8F3;--ink:#15181A;--ink2:#4A5157;--ink3:#626A70;--accent:#B4532F;--soft:#FBEDE4;--rule:#E4DED2;--warn:#8A4B12;--warnbg:#FBF1E4}
[hidden]{display:none!important}*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"Inter","Noto Sans Devanagari","Nirmala UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;min-height:100dvh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;background:radial-gradient(50% 45% at 15% 10%,#FCE7C2,transparent 70%),radial-gradient(50% 45% at 90% 30%,#DCEBF5,transparent 70%),radial-gradient(55% 50% at 40% 100%,#FFD9C2,transparent 70%)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px max(16px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:19px;letter-spacing:-.03em;color:var(--ink);text-decoration:none}.brand img{width:28px;height:28px}.brand .vm{font-size:22px}
.lang{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--rule);border-radius:999px;background:#fff8}
.lang button{border:0;background:none;border-radius:999px;padding:5px 10px;font:inherit;font-size:13px;color:var(--ink3);cursor:pointer}.lang button[aria-pressed=true]{background:var(--accent);color:#fff}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 20px 28px}
.card{width:100%;max-width:520px;text-align:center}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px}
h1{font-family:"Fraunces","Noto Serif Devanagari",Georgia,serif;font-weight:500;letter-spacing:-.02em;font-size:clamp(28px,7vw,40px);line-height:1.12;margin:0 0 10px}
.sub{color:var(--ink2);font-size:17px;line-height:1.5;margin:0 auto 22px;max-width:420px}
.big{font-family:"Fraunces",Georgia,serif;font-size:clamp(72px,22vw,120px);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;margin:8px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:#fff;font:600 16px/1 inherit;font-family:inherit;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}.btn+.btn{margin-left:8px}
.link{display:inline-block;margin-top:16px;color:var(--ink3);font-size:14px}
.ring{position:relative;width:min(62vw,240px);aspect-ratio:1;margin:0 auto 18px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}.ring .bg{stroke:#00000010}.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .breath{position:absolute;inset:22%;border-radius:50%;background:var(--soft);transition:transform 4s ease-in-out}
.ring .sec{position:absolute;inset:0;display:grid;place-items:center;font:500 34px "Fraunces",Georgia,serif;color:var(--accent);font-variant-numeric:tabular-nums}
.bar{display:flex;gap:4px;justify-content:center;margin:0 0 18px}.bar i{width:34px;height:4px;border-radius:2px;background:#00000014}.bar i.on{background:var(--accent)}.bar i.past{background:#B4532F66}
.do{font-size:19px;line-height:1.4;font-weight:500;margin:0 0 6px}.how{color:var(--ink2);font-size:15px;margin:0}
input.next{width:100%;margin:16px 0 4px;font:500 17px inherit;font-family:inherit;padding:14px 16px;border:1px solid var(--rule);border-radius:14px;background:#fff;text-align:center}

.foot{display:flex;justify-content:center;gap:18px;padding:0 16px max(16px,env(safe-area-inset-bottom))}
.foot button{background:none;border:0;color:var(--ink3);font:inherit;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:10px}
.alert{background:var(--warnbg);color:var(--warn);border-radius:16px;padding:16px;text-align:left;line-height:1.5;margin:0 0 18px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.ring .breath,.ring .fg{transition:none}}
.top{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 8px}.top #tl{color:var(--ink3);letter-spacing:.04em}

.orb.dot{inset:auto;width:18%;height:18%;top:41%;left:41%;background:var(--accent);box-shadow:none;transition:transform .2s linear;transform-origin:50% 50%}
.guide b{position:relative;font:600 15px/1 inherit;font-family:inherit;letter-spacing:.2em;color:var(--accent)}
.g1 .orb.dot{transition:transform 1.2s ease-in-out}
.big2{font-family:"Fraunces","Noto Serif Devanagari",Georgia,serif;font-weight:500;font-size:clamp(22px,5.4vw,30px);line-height:1.2;letter-spacing:-.01em;margin:0 0 8px}
.upnext{margin:22px 0 0;font-size:13px;color:var(--ink3)}
.row2{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.foot button{background:#fff9;border:1px solid var(--rule);border-radius:999px;text-decoration:none;padding:8px 16px}
@media (prefers-reduced-motion:reduce){.orb{transition:none}}
.wait,.settle{position:relative;width:min(52vw,200px);aspect-ratio:1;margin:6px auto 18px;display:grid;place-items:center}
.orb2{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--soft) 60%,#F5DED1);box-shadow:0 22px 50px -26px #B4532F77;animation:breathe 6s ease-in-out infinite}
.wait .big{position:relative;font-size:clamp(48px,14vw,72px);margin:0}
.settle .orb2{animation:settle 2.4s ease-out forwards}

@keyframes settle{from{transform:scale(1.08);opacity:.6}to{transform:scale(.7);opacity:1}}
.h-hold{font-size:clamp(22px,5.6vw,30px)}

@media (prefers-reduced-motion:reduce){.orb2{animation:none}}
.wait.sm{width:min(38vw,150px)}
.notice2{margin-top:6px!important;}.notice2+.tiny,.notice2{margin-bottom:18px}.notice2{font:500 18px/1.4 "Fraunces","Noto Serif Devanagari",Georgia,serif;color:var(--ink2);margin:0 0 6px}

function sndBtn(){return '<button class="cue" id="snd" type="button" aria-pressed="'+sndOn+'">'+esc(SNDN[lang][sndOn?todaySnd():'off'])+'</button>';}
function wireSnd(){var b=document.getElementById('snd');if(b)b.onclick=function(){sndOn=!sndOn;try{localStorage.setItem('viraam.snd',sndOn?'on':'off');}catch(e){}b.setAttribute('aria-pressed',String(sndOn));b.textContent=SNDN[lang][sndOn?todaySnd():'off'];actx();sndPlay();};}
function wireCue(){var b=document.getElementById('cue');if(b)b.onclick=function(){cueOn=!cueOn;try{localStorage.setItem('sukoon.cue',cueOn?'1':'0');}catch(e){}b.setAttribute('aria-pressed',String(cueOn));b.textContent=cueOn?t('cueOn'):t('cueOff');if(cueOn)ping();};}
function ping(){if(!cueOn)return;try{if(navigator.vibrate)navigator.vibrate(60);var C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=ac||new C();var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=528;g.gain.setValueAtTime(0.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.08,ac.currentTime+0.05);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.9);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+1);}catch(e){}}
function nextPrompt(){if(personal)return t('me').plan;var d=new Date().getDay();return d===1?t('monday'):d===5?t('friday'):T[lang].p[5][1];}
function setLang(l){lang=l;try{localStorage.setItem('sukoon.lang',l);}catch(e){}document.documentElement.lang=l;document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.l===l));});document.getElementById('stop').textContent=t('stop');document.getElementById('hurt').textContent=t('hurt');draw(true);}
function idle(){mode='idle';foot.hidden=true;if(personal){var M=t('me');view.innerHTML='<p class="kicker">'+esc(greet())+'</p><div class="wait sm"><i class="orb2"></i></div><h1>'+esc(M.title)+'</h1><p class="sub">'+esc(M.sub)+'</p><button class="btn" id="go">'+esc(M.start)+'</button><br><a class="link" href="../start.html">'+esc(t('makeLink'))+' →</a><br>'+cueBtn()+sndBtn()+'<br>'+pinBtn();document.getElementById('go').onclick=function(){begin(Date.now()+3000);};wireCue();wireSnd();wirePin();return;}view.innerHTML='<p class="kicker">'+esc(greet())+'</p><div class="wait sm"><i class="orb2"></i></div><h1>'+esc(t('idleLine'))+'</h1><p class="sub">'+esc(t('startSub'))+'</p><button class="btn" id="go">'+esc(t('startNow'))+'</button><br><a class="link" href="../start.html">'+esc(t('makeLink'))+' →</a><p class="tiny">'+esc(t('promise'))+'</p>'+cueBtn()+sndBtn();document.getElementById('go').onclick=function(){begin(Date.now()+3000);};wireCue();wireSnd();}
function counted(ev){var k='viraam.c.'+ev+'.'+start;try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1');}catch(e){}send(ev);}
function begin(s){start=s;mode='run';counted('session-started');sndPlay();foot.hidden=false;loop();}
function loop(){cancelAnimationFrame(raf);var tick=function(){draw(false);if(mode==='run'||mode==='hold')raf=requestAnimationFrame(function(){setTimeout(tick,200);});};tick();}
var lastKey='';
function draw(force){
  if(mode==='idle'){if(force)idle();return;}
  if(mode==='stopped'||mode==='safe'||mode==='done'||mode==='late'){if(force)({stopped:stopped,safe:safe,done:done,late:late})[mode]();return;}
  var now=Date.now();
  if(mode==='hold'||now<start){var s=Math.ceil((start-now)/1000);var key='hold'+lang;if(key!==lastKey||force){lastKey=key;foot.hidden=true;view.innerHTML='<p class="kicker">'+esc(greet())+'</p><div class="wait"><i class="orb2"></i><div class="big" id="cd"></div></div><h1 class="h-hold">'+(at?esc(t('hold'))+' '+hhmm(start):'…')+'</h1>'+(at?'<p class="sub">'+esc(t('shared'))+'<br>'+esc(t('promise'))+'</p>':'')+'<button class="btn ghost" id="early">'+esc(t('startEarly'))+'</button><br>'+cueBtn()+sndBtn();document.getElementById('early').onclick=function(){begin(Date.now());};wireCue();wireSnd();}
    var cd=document.getElementById('cd');if(cd)cd.textContent=s>59?Math.floor(s/60)+':'+('0'+s%60).slice(-2):String(s);if(now>=start){mode='run';counted('session-started');sndPlay();foot.hidden=false;}return;}
  var e=(now-start)/1000;if(mode==='done')return;if(e>=ENDS[5]){mode='done';counted('session-finished');done();return;}
  var i=0;while(e>=ENDS[i])i++;var p0=i?ENDS[i-1]:0,left=Math.ceil(ENDS[i]-e),frac=(e-p0)/(ENDS[i]-p0),ph=P(i).slice();if(personal&&i===0)ph[1]=t('me').land;
  if(i!==lastPhase){if(lastPhase>=0||i===0)ping();lastPhase=i;}
  var key='run'+i+lang,cu=t('cue');
  if(key!==lastKey||force){lastKey=key;foot.hidden=i>=6;var sf=document.getElementById('sndf');if(sf){sf.innerHTML=sndBtn();wireSnd();}
    var bar='<div class="bar">'+[0,1,2,3,4,5].map(function(k){return '<i class="'+(k===i?'on':k<i?'past':'')+'"></i>';}).join('')+'</div>';
    var top='<div class="top"><span>'+(i+1)+' · '+esc(ph[0])+'</span><span id="tl"></span></div>'+bar;
    var nxt=i<5?'<p class="upnext">'+esc(t('upnext'))+' · '+esc(P(i+1)[0])+'</p>':'';
    var mid=i===5?'<p class="do big2">'+esc(nextPrompt())+'</p><input class="next" id="nx" maxlength="80" enterkeyhint="done" placeholder="'+esc(t('nextPh'))+'" value="'+esc(nextText)+'"><div class="row2"><button class="btn" id="dn" type="button" style="margin:22px 0 6px">'+esc(FIN[lang])+'</button><span class="tiny">'+esc(ph[2])+'</span></div>'
      :'<div class="guide g'+i+'" id="gd"><i class="orb" id="orb"></i><b id="cw"></b><svg viewBox="0 0 100 100" class="arc"><circle class="bg" cx="50" cy="50" r="47"/><circle class="fg" id="fg" cx="50" cy="50" r="47" stroke-dasharray="295.3" stroke-dashoffset="295.3"/></svg></div><p class="do big2">'+esc(ph[1])+'</p><p class="how">'+esc(ph[2])+'</p>';
    view.innerHTML=top+mid+nxt;
    var nx=document.getElementById('nx');if(nx){nx.oninput=function(){nextText=nx.value;};var fin=function(){if(mode==='done')return;nextText=nx.value;mode='done';counted('session-finished');done();};document.getElementById('dn').onclick=fin;nx.onkeydown=function(ev){if(ev.key==='Enter'){ev.preventDefault();nx.blur();fin();}};if(matchMedia('(pointer:fine)').matches)nx.focus();}}
  var rest=Math.max(0,Math.ceil(TOTAL-e)),tl=document.getElementById('tl');if(tl)tl.textContent=(i===0||i>=5)?'':Math.floor(rest/60)+':'+('0'+rest%60).slice(-2)+' '+t('leftw');
  var fg=document.getElementById('fg');if(fg)fg.setAttribute('stroke-dashoffset',String(295.3*(1-frac)));
  var pe=e-p0,cw=document.getElementById('cw'),orb=document.getElementById('orb'),word='',sc=1,ang=null;
  if(i===0){var c=pe%11;word=c<4?cu[0]:c<5?cu[1]:cu[2];sc=c<4?0.7+0.12*c:c<5?1.22:1.22-0.09*(c-5);}
  else if(i>=1&&i<=3){var k=KIND[dayIdx()][i-1],c2=CU2[lang];
    if(k==='side'){word=pe<10?cu[3]:cu[4];ang=pe<10?-28:28;}
    else if(k==='roll'){word=cu[5];ang=(pe*72)%360;}
    else if(k==='circle'){word=cu[6];ang=(pe*180)%360;}
    else if(k==='updown'){var u=pe%4;word=u<2?c2[0]:c2[1];sc=u<2?1.2:0.8;}
    else{var h=pe%6;word=h<3?c2[2]:c2[3];sc=h<3?1.15:0.85;}}
  else if(i===4){var bl=pe>=6&&(pe%8)<1.2;word=bl?cu[8]:cu[7];sc=bl?0.92:1;}
  if(cw&&cw.textContent!==word)cw.textContent=word;
  if(orb){orb.style.transform=ang===null?'scale('+sc+')':'rotate('+ang+'deg) translateY(calc(min(58vw,230px)*-0.38))';orb.classList.toggle('dot',ang!==null);}
}
function done(){foot.hidden=true;sndStop(2.5);cancelAnimationFrame(raf);ping();if(!tallyN)tallyN=bumpTally();var back=hhmm((start||Date.now())+TOTAL*1000+30000);view.innerHTML='<div class="settle"><i class="orb2"></i></div><p class="kicker">'+esc(t('nice'))+(team?', '+esc(team):'')+'</p><h1>'+(personal?esc(T[lang].p[6][1]):esc(t('back'))+' '+back+'.')+'</h1>'+(nextText?'<div class="taskcard"><span>'+esc(t('yours'))+'</span><p>'+esc(nextText)+'</p><button class="copy" id="cp2" type="button">'+esc(t('copy'))+'</button></div>':'')+'<p class="sub">'+esc(t('closeTab'))+'</p>'+'<p class="tiny">'+esc(tomorrowLine())+'</p>'+(tallyN?'<p class="tiny">'+esc(t('me').tally(tallyN))+'</p>':'')+(personal?'<br><button class="link" id="again" type="button" style="background:none;border:0;cursor:pointer;font-family:inherit">'+esc(t('again'))+'</button>':'');var c2=document.getElementById('cp2');if(c2)c2.onclick=function(){if(navigator.clipboard)navigator.clipboard.writeText(nextText).then(function(){c2.textContent=t('copied');},function(){});};var ag=document.getElementById('again');if(ag)ag.onclick=function(){nextText='';lastPhase=-1;tallyN=0;begin(Date.now()+3000);};}
function late(){foot.hidden=true;view.innerHTML='<p class="kicker">'+esc(team||t('team'))+'</p><h1>'+esc(t('late'))+' '+hhmm(at+TOTAL*1000)+'.</h1><p class="sub">'+esc(t('lateSub'))+'</p><button class="btn" id="go">'+esc(t('startNow'))+'</button>';document.getElementById('go').onclick=function(){begin(Date.now()+3000);};}
function stopped(){foot.hidden=true;cancelAnimationFrame(raf);view.innerHTML='<h1>'+esc(t('stopped'))+'</h1><p class="sub">'+esc(t('stoppedSub'))+'</p><button class="btn ghost" id="again">'+esc(t('again'))+'</button>';document.getElementById('again').onclick=function(){begin(Date.now()+3000);};}
function safe(){foot.hidden=true;cancelAnimationFrame(raf);view.innerHTML='<h1>'+esc(t('safeT'))+'</h1><div class="alert">'+esc(t('safeA'))+'</div><p class="sub">'+esc(t('safeB'))+'</p><button class="btn ghost" id="ok">'+esc(t('ok'))+'</button>';document.getElementById('ok').onclick=function(){mode='stopped';stopped();};}
document.getElementById('stop').onclick=function(){sndStop(0.6);mode='stopped';stopped();};
document.getElementById('hurt').onclick=function(){sndStop(0.4);mode='safe';safe();};
document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){setLang(b.dataset.l);};});
// A link with a time joins the shared timeline: wait, run, or catch up mid-way.
if(at){var since=(Date.now()-at)/1000;if(since<-20*60){start=null;idle();}else if(since<0){start=at;mode='hold';loop();}else if(since<TOTAL){begin(at);}else{mode='late';late();}}
else if(q.get('start')==='1'){begin(Date.now()+3000);}else idle();
setLang(lang);
})();
</script>
